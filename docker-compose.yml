services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hypothesis
      POSTGRES_USER: hypothesis
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-change_me_local}
    ports:
      - "5432:5432"
    volumes:
      - hypothesis_pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/hypothesis
      DATABASE_USER: hypothesis
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-change_me_local}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-google_cse}
      SEARCH_API_KEY: ${SEARCH_API_KEY}
      SEARCH_ENGINE_ID: ${SEARCH_ENGINE_ID}
      ALLOWED_ORIGIN: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  hypothesis_pgdata:
