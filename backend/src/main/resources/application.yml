server:
  port: ${PORT:8080}

spring:
  application:
    name: hypothesis-backend
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/hypothesis-db;AUTO_SERVER=TRUE}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

hypothesis:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-4-hydrogen}
    base-url: https://generativelanguage.googleapis.com/v1beta
  search:
    provider: ${SEARCH_PROVIDER:gemini_grounding}
    api-key: ${SEARCH_API_KEY:}
    engine-id: ${SEARCH_ENGINE_ID:}
  cors:
    allowed-origin: ${ALLOWED_ORIGIN:http://localhost:3000}
